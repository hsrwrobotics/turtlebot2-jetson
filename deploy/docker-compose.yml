# ROS settings shared by every ROS container. RMW_IMPLEMENTATION and
# ZENOH_CONFIG_OVERRIDE come from /opt/compose/.env.
x-ros-env: &ros-env
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
  ZENOH_CONFIG_OVERRIDE: ${ZENOH_CONFIG_OVERRIDE}
  ROS_DOMAIN_ID: 10

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    env_file:
      - /opt/compose/.env
    volumes:
      - /opt/compose/tailscale/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    network_mode: host
    restart: unless-stopped

  kobuki:
    image: tsecretino/kobuki:latest
    container_name: kobuki
    command: ros2 launch kobuki kobuki.launch.py
    environment: *ros-env
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev

  camera:
    image: tsecretino/kobuki:latest
    container_name: camera
    command: ros2 launch openni2_camera camera_with_cloud.launch.py
    environment: *ros-env
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev

  # Fake 2D laser scan from a strip of the camera's depth image, for SLAM / Nav2.
  scan:
    image: tsecretino/kobuki:latest
    container_name: scan
    command: >
      ros2 run depthimage_to_laserscan depthimage_to_laserscan_node
      --ros-args
      -r depth:=/camera/depth/image_raw
      -r depth_camera_info:=/camera/depth/camera_info
      -p output_frame:=camera_depth_frame
      -p scan_height:=10
      -p range_min:=0.45
      -p range_max:=4.0
    environment: *ros-env
    restart: unless-stopped
    network_mode: host

  rosbridge:
    image: tsecretino/kobuki:latest
    container_name: rosbridge
    command: >
      ros2 launch rosbridge_server
      rosbridge_websocket_launch.xml
    environment: *ros-env
    restart: unless-stopped
    network_mode: host
