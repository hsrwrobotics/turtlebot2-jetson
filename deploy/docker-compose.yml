services:
  kobuki:
    image: tsecretino/kobuki:latest
    container_name: kobuki
    command: ros2 launch kobuki kobuki.launch.py
    environment:
      - ROS_DOMAIN_ID=10
      - ROS_LOCALHOST_ONLY=0
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev

  camera:
    image: tsecretino/kobuki:latest
    container_name: camera
    command: >
      ros2 launch openni2_camera camera_with_cloud.launch.py
    environment:
      - ROS_DOMAIN_ID=10
      - ROS_LOCALHOST_ONLY=0
    restart: unless-stopped
    privileged: true
    network_mode: host
    volumes:
      - /dev:/dev

  rosbridge:
    image: tsecretino/kobuki:latest
    container_name: rosbridge
    command: >
      ros2 launch rosbridge_server
      rosbridge_websocket_launch.xml
    environment:
      - ROS_DOMAIN_ID=10
      - ROS_LOCALHOST_ONLY=0
    restart: unless-stopped
    network_mode: host
