name: Build and Publish Kobuki Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "kobuki/**"
      - ".github/workflows/kobuki-docker-publish.yml"

jobs:
  docker:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: kobuki/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kobuki:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kobuki:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
